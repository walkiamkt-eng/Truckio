<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines / Highway -->
  <path d="M96 384 L416 384" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <path d="M160 416 L352 416" stroke="#475569" stroke-width="8" stroke-dasharray="24 16" stroke-linecap="round" />

  <!-- Truck Cab and Trailer Silhouette -->
  <!-- Trailer Body -->
  <rect x="80" y="160" width="200" height="160" rx="14" fill="#334155" />
  <rect x="92" y="172" width="176" height="136" rx="8" fill="#1e293b" stroke="#475569" stroke-width="4" />
  <path d="M120 190 L120 290 M160 190 L160 290 M200 190 L200 290 M240 190 L240 290" stroke="#334155" stroke-width="3" />

  <!-- Connector -->
  <rect x="276" y="270" width="24" height="20" rx="4" fill="#64748b" />

  <!-- Truck Cab -->
  <path d="M296 170 C296 156 308 144 322 144 L370 144 C386 144 400 156 408 172 L428 214 C432 222 436 230 436 240 L436 320 C436 324 432 328 428 328 L296 328 Z" fill="url(#truckGrad)" />
  
  <!-- Windshield -->
  <path d="M336 160 L370 160 C378 160 386 166 390 174 L408 212 C410 216 408 220 404 220 L336 220 C332 220 328 216 328 212 L328 168 C328 164 332 160 336 160 Z" fill="#0f172a" opacity="0.85" />
  <!-- Windshield Reflection -->
  <path d="M344 168 L368 168 L386 206 L362 206 Z" fill="url(#accentGrad)" opacity="0.6" />

  <!-- Grill Lines -->
  <line x1="428" y1="246" x2="400" y2="246" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="428" y1="260" x2="396" y2="260" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <line x1="428" y1="274" x2="404" y2="274" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Wheels with Rims -->
  <!-- Trailer Wheels -->
  <circle cx="132" cy="336" r="34" fill="#090d16" stroke="#475569" stroke-width="6" />
  <circle cx="132" cy="336" r="16" fill="#64748b" />
  <circle cx="212" cy="336" r="34" fill="#090d16" stroke="#475569" stroke-width="6" />
  <circle cx="212" cy="336" r="16" fill="#64748b" />
  <!-- Truck Wheels -->
  <circle cx="344" cy="336" r="34" fill="#090d16" stroke="#ea580c" stroke-width="6" />
  <circle cx="344" cy="336" r="16" fill="#94a3b8" />
  <circle cx="406" cy="336" r="28" fill="#090d16" stroke="#ea580c" stroke-width="5" />
  <circle cx="406" cy="336" r="13" fill="#94a3b8" />

  <!-- Brand Checkmark / Pulse Signal -->
  <circle cx="390" cy="110" r="18" fill="#10b981" />
  <path d="M382 110 L388 116 L399 104" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
